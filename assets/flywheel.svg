<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
  <rect width="600" height="340" rx="12" fill="#FAF3E6"/>
  <text x="300" y="25" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#5B3A29">BASED NUT Liquidity Flywheel</text>
  <!-- Center -->
  <circle cx="300" cy="170" r="40" fill="#7D5A50"/>
  <text x="300" y="168" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#FAF3E6">NUT</text>
  <text x="300" y="183" text-anchor="middle" font-family="monospace" font-size="7" fill="#F2E4CE">supply=1</text>
  <!-- Arrows (circular) -->
  <path d="M 300 130 A 40 40 0 0 1 340 170" stroke="#A67C52" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- SNUT burn -->
  <rect x="100" y="80" width="120" height="50" rx="8" fill="#D1B48C" stroke="#7D5A50" stroke-width="1.5"/>
  <text x="160" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#5B3A29">SNUT Tax</text>
  <text x="160" y="115" text-anchor="middle" font-family="monospace" font-size="8" fill="#5B3A29">1% → buy NUT</text>
  <text x="160" y="125" text-anchor="middle" font-family="monospace" font-size="8" fill="#5B3A29">→ burn to 0x..dEaD</text>
  <line x1="220" y1="105" x2="265" y2="145" stroke="#A67C52" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Bonding curves -->
  <rect x="380" y="80" width="140" height="50" rx="8" fill="#E6B87D" stroke="#7D5A50" stroke-width="1.5"/>
  <text x="450" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#5B3A29">MintClub</text>
  <text x="450" y="115" text-anchor="middle" font-family="monospace" font-size="8" fill="#5B3A29">SALT + NUTINO</text>
  <text x="450" y="125" text-anchor="middle" font-family="monospace" font-size="8" fill="#5B3A29">locks NUT → mints</text>
  <line x1="380" y1="105" x2="335" y2="145" stroke="#A67C52" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- AMM pools -->
  <rect x="60" y="220" width="130" height="50" rx="8" fill="#D1B48C" stroke="#7D5A50" stroke-width="1.5"/>
  <text x="125" y="240" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#5B3A29">AMM Pools</text>
  <text x="125" y="255" text-anchor="middle" font-family="monospace" font-size="8" fill="#5B3A29">Uni V3 + Aero</text>
  <text x="125" y="265" text-anchor="middle" font-family="monospace" font-size="8" fill="#5B3A29">price discovery</text>
  <line x1="190" y1="240" x2="265" y2="195" stroke="#A67C52" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Index -->
  <rect x="410" y="220" width="130" height="50" rx="8" fill="#D1B48C" stroke="#7D5A50" stroke-width="1.5"/>
  <text x="475" y="240" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#5B3A29">pNUT Index</text>
  <text x="475" y="255" text-anchor="middle" font-family="monospace" font-size="8" fill="#5B3A29">Balancer V2</text>
  <text x="475" y="265" text-anchor="middle" font-family="monospace" font-size="8" fill="#5B3A29">25/25/25/25</text>
  <line x1="410" y1="240" x2="335" y2="195" stroke="#A67C52" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arb -->
  <text x="300" y="310" text-anchor="middle" font-family="monospace" font-size="9" fill="#7D5A50" opacity="0.7">Structural price gaps → arbitrageurs close spreads → liquidity recycled to root</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#A67C52"/>
    </marker>
  </defs>
</svg>
