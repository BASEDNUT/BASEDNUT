<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520">
  <rect width="680" height="520" rx="14" fill="#FAF3E6"/>

  <!-- ===== SOIL ===== -->
  <ellipse cx="340" cy="430" rx="260" ry="26" fill="#A67C52" opacity="0.25"/>
  <text x="340" y="436" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#7D5A50" font-weight="bold">MintClub — Bonding Curve Soil</text>

  <!-- ===== ROOTS ===== -->
  <path d="M295 430 Q245 448 200 438" stroke="#7D5A50" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M385 430 Q435 448 480 438" stroke="#7D5A50" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M300 430 Q260 452 225 448" stroke="#A67C52" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M380 430 Q420 452 455 448" stroke="#A67C52" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- ===== TRUNK ===== -->
  <path d="M295 430 L310 210 L370 210 L385 430 Z" fill="#7D5A50"/>
  <text x="340" y="320" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#FAF3E6">NUT</text>
  <text x="340" y="348" text-anchor="middle" font-family="monospace" font-size="14" fill="#F2E4CE">supply = 1</text>
  <text x="340" y="366" text-anchor="middle" font-family="monospace" font-size="11" fill="#D1B48C">18 decimals · 0% tax</text>

  <!-- ===== BRANCHES ===== -->
  <path d="M310 215 Q225 175 140 120" stroke="#A67C52" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M340 210 L340 80" stroke="#A67C52" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M370 215 Q460 175 545 120" stroke="#A67C52" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M545 120 Q600 165 595 240" stroke="#A67C52" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- ===== SNUT (left) ===== -->
  <circle cx="115" cy="100" r="46" fill="#D1B48C" stroke="#7D5A50" stroke-width="2.5"/>
  <text x="115" y="97" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="bold" fill="#5B3A29">SNUT</text>
  <text x="115" y="115" text-anchor="middle" font-family="monospace" font-size="10" fill="#5B3A29">9 dec · 1% tax</text>
  <text x="115" y="130" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#7D5A50" opacity="0.6">burn sink</text>

  <!-- ===== pNUT (center) ===== -->
  <circle cx="340" cy="55" r="46" fill="#D1B48C" stroke="#7D5A50" stroke-width="2.5"/>
  <text x="340" y="52" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="bold" fill="#5B3A29">pNUT</text>
  <text x="340" y="70" text-anchor="middle" font-family="monospace" font-size="10" fill="#5B3A29">Balancer index</text>
  <text x="340" y="85" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#7D5A50" opacity="0.6">25/25/25/25</text>

  <!-- ===== NUTINO (right) ===== -->
  <circle cx="545" cy="100" r="42" fill="#E6B87D" stroke="#7D5A50" stroke-width="2.5"/>
  <text x="545" y="97" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#5B3A29">NUTINO</text>
  <text x="545" y="114" text-anchor="middle" font-family="monospace" font-size="10" fill="#5B3A29">exp curve</text>

  <!-- ===== SALT (leaf, hangs from NUTINO) ===== -->
  <circle cx="600" cy="260" r="38" fill="#E6B87D" stroke="#7D5A50" stroke-width="2.5"/>
  <text x="600" y="258" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#5B3A29">SALT</text>
  <text x="600" y="273" text-anchor="middle" font-family="monospace" font-size="10" fill="#5B3A29">flat curve</text>

  <!-- ===== FRUIT ROW (NFTs, clean bottom row) ===== -->
  <line x1="80" y1="465" x2="600" y2="465" stroke="#A67C52" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
  <text x="340" y="460" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#7D5A50" font-style="italic" opacity="0.7">Fruit — NFT Collections</text>

  <circle cx="120" cy="490" r="18" fill="#E6B87D" stroke="#7D5A50" stroke-width="1.5"/>
  <text x="120" y="495" text-anchor="middle" font-size="15">🌰</text>
  <text x="120" y="513" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7D5A50" font-weight="bold">P-NUTS</text>

  <circle cx="260" cy="490" r="18" fill="#E6B87D" stroke="#7D5A50" stroke-width="1.5"/>
  <text x="260" y="495" text-anchor="middle" font-size="15">🌰</text>
  <text x="260" y="513" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7D5A50" font-weight="bold">ALMD</text>

  <circle cx="400" cy="490" r="18" fill="#E6B87D" stroke="#7D5A50" stroke-width="1.5"/>
  <text x="400" y="495" text-anchor="middle" font-size="15">🌰</text>
  <text x="400" y="513" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7D5A50" font-weight="bold">S-ALMD</text>

  <circle cx="540" cy="490" r="18" fill="#E6B87D" stroke="#7D5A50" stroke-width="1.5"/>
  <text x="540" y="495" text-anchor="middle" font-size="15">🌰</text>
  <text x="540" y="513" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7D5A50" font-weight="bold">PNUTRMY</text>
</svg>
