<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460">
  <rect width="680" height="460" rx="12" fill="#FAF3E6"/>

  <!-- Soil -->
  <ellipse cx="340" cy="430" rx="240" ry="24" fill="#A67C52" opacity="0.3"/>
  <text x="340" y="436" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#7D5A50" font-weight="bold">MintClub — Bonding Curve Soil</text>

  <!-- Roots -->
  <path d="M295 430 Q250 445 215 438" stroke="#7D5A50" stroke-width="4" fill="none"/>
  <path d="M385 430 Q430 445 465 438" stroke="#7D5A50" stroke-width="4" fill="none"/>
  <path d="M295 430 Q260 452 230 448" stroke="#A67C52" stroke-width="3" fill="none"/>
  <path d="M385 430 Q420 452 450 448" stroke="#A67C52" stroke-width="3" fill="none"/>

  <!-- ===== TRUNK (thick, readable) ===== -->
  <path d="M290 430 L270 230 L410 230 L390 430 Z" fill="#7D5A50"/>
  <text x="340" y="330" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" fill="#FAF3E6">NUT</text>
  <text x="340" y="355" text-anchor="middle" font-family="monospace" font-size="13" fill="#F2E4CE">supply = 1</text>
  <text x="340" y="372" text-anchor="middle" font-family="monospace" font-size="11" fill="#D1B48C">18 decimals · 0% tax</text>

  <!-- ===== BRANCHES (thick, organic) ===== -->
  <!-- Left branch to SNUT -->
  <path d="M270 235 Q200 195 150 150" stroke="#A67C52" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Center branch to pNUT -->
  <path d="M340 230 Q340 190 340 120" stroke="#A67C52" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Right branch to NUTINO -->
  <path d="M410 235 Q480 195 530 150" stroke="#A67C52" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Sub-branch: NUTINO to SALT (leaf) -->
  <path d="M530 150 Q580 200 570 260" stroke="#A67C52" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- ===== SNUT (left branch) ===== -->
  <circle cx="120" cy="125" r="44" fill="#D1B48C" stroke="#7D5A50" stroke-width="2.5"/>
  <text x="120" y="122" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#5B3A29">SNUT</text>
  <text x="120" y="140" text-anchor="middle" font-family="monospace" font-size="10" fill="#5B3A29">9 dec · 1% tax</text>
  <text x="120" y="155" text-anchor="middle" font-family="monospace" font-size="9" fill="#7D5A50" opacity="0.7">burn sink</text>

  <!-- ===== pNUT (center branch) ===== -->
  <circle cx="340" cy="85" r="44" fill="#D1B48C" stroke="#7D5A50" stroke-width="2.5"/>
  <text x="340" y="82" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#5B3A29">pNUT</text>
  <text x="340" y="100" text-anchor="middle" font-family="monospace" font-size="9" fill="#5B3A29">Balancer index</text>
  <text x="340" y="113" text-anchor="middle" font-family="monospace" font-size="9" fill="#7D5A50" opacity="0.7">25/25/25/25</text>

  <!-- ===== NUTINO (right branch) ===== -->
  <circle cx="530" cy="125" r="40" fill="#E6B87D" stroke="#7D5A50" stroke-width="2.5"/>
  <text x="530" y="122" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#5B3A29">NUTINO</text>
  <text x="530" y="138" text-anchor="middle" font-family="monospace" font-size="9" fill="#5B3A29">exp curve</text>

  <!-- ===== SALT (leaf, hanging from NUTINO branch) ===== -->
  <circle cx="575" cy="280" r="36" fill="#E6B87D" stroke="#7D5A50" stroke-width="2.5"/>
  <text x="575" y="278" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#5B3A29">SALT</text>
  <text x="575" y="293" text-anchor="middle" font-family="monospace" font-size="9" fill="#5B3A29">flat curve</text>

  <!-- ===== FRUIT (NFTs, hanging from branches) ===== -->
  <!-- Left fruit cluster -->
  <text x="50" y="80" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#A67C52" font-weight="bold">🌰 P-NUTS</text>
  <text x="50" y="100" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#A67C52" font-weight="bold">🌰 ALMD</text>
  <text x="50" y="120" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#A67C52" font-weight="bold">🌰 S-ALMD</text>
  <path d="M75 90 Q95 110 120 125" stroke="#A67C52" stroke-width="2" stroke-dasharray="3,3" fill="none" opacity="0.5"/>
  <!-- Right fruit -->
  <text x="600" y="80" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#A67C52" font-weight="bold">🌰 PNUTRMY</text>
  <path d="M610 90 Q570 105 530 125" stroke="#A67C52" stroke-width="2" stroke-dasharray="3,3" fill="none" opacity="0.5"/>

  <!-- ===== ROLE LABELS ===== -->
  <text x="340" y="395" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#D1B48C" font-style="italic">trunk</text>
  <text x="185" y="180" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7D5A50" font-style="italic">branch</text>
  <text x="365" y="160" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7D5A50" font-style="italic">branch</text>
  <text x="485" y="180" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7D5A50" font-style="italic">branch</text>
  <text x="575" y="325" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7D5A50" font-style="italic">leaf</text>
  <text x="75" y="65" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7D5A50" font-style="italic">fruit</text>
  <text x="625" y="65" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7D5A50" font-style="italic">fruit</text>
</svg>
