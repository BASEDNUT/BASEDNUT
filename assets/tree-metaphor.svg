<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <rect width="640" height="420" rx="12" fill="#FAF3E6"/>

  <!-- Soil -->
  <ellipse cx="320" cy="395" rx="220" ry="22" fill="#A67C52" opacity="0.3"/>
  <text x="320" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#7D5A50" font-weight="bold">MintClub — Bonding Curve Soil</text>

  <!-- Roots -->
  <path d="M280 395 Q240 410 210 400" stroke="#7D5A50" stroke-width="4" fill="none"/>
  <path d="M360 395 Q400 410 430 400" stroke="#7D5A50" stroke-width="4" fill="none"/>
  <path d="M280 395 Q250 415 225 410" stroke="#A67C52" stroke-width="3" fill="none"/>
  <path d="M360 395 Q390 415 415 410" stroke="#A67C52" stroke-width="3" fill="none"/>

  <!-- Trunk (thick) -->
  <rect x="270" y="210" width="100" height="185" rx="8" fill="#7D5A50"/>
  <text x="320" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#FAF3E6">NUT</text>
  <text x="320" y="325" text-anchor="middle" font-family="monospace" font-size="12" fill="#F2E4CE">supply = 1</text>
  <text x="320" y="340" text-anchor="middle" font-family="monospace" font-size="10" fill="#D1B48C">18 decimals</text>

  <!-- Branches (thicker) -->
  <line x1="270" y1="215" x2="160" y2="150" stroke="#A67C52" stroke-width="7" stroke-linecap="round"/>
  <line x1="370" y1="215" x2="480" y2="150" stroke="#A67C52" stroke-width="7" stroke-linecap="round"/>
  <line x1="320" y1="210" x2="320" y2="120" stroke="#A67C52" stroke-width="7" stroke-linecap="round"/>

  <!-- SNUT branch -->
  <circle cx="130" cy="115" r="42" fill="#D1B48C" stroke="#7D5A50" stroke-width="2.5"/>
  <text x="130" y="113" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#5B3A29">SNUT</text>
  <text x="130" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#5B3A29">9 dec · 1% tax</text>

  <!-- pNUT branch -->
  <circle cx="320" cy="90" r="42" fill="#D1B48C" stroke="#7D5A50" stroke-width="2.5"/>
  <text x="320" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#5B3A29">pNUT</text>
  <text x="320" y="105" text-anchor="middle" font-family="monospace" font-size="9" fill="#5B3A29">Balancer index</text>

  <!-- NUTINO leaf -->
  <circle cx="510" cy="115" r="38" fill="#E6B87D" stroke="#7D5A50" stroke-width="2.5"/>
  <text x="510" y="113" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#5B3A29">NUTINO</text>
  <text x="510" y="128" text-anchor="middle" font-family="monospace" font-size="9" fill="#5B3A29">exp curve</text>

  <!-- SALT leaf -->
  <circle cx="540" cy="210" r="38" fill="#E6B87D" stroke="#7D5A50" stroke-width="2.5"/>
  <text x="545" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#5B3A29">SALT</text>
  <text x="545" y="223" text-anchor="middle" font-family="monospace" font-size="9" fill="#5B3A29">flat curve</text>

  <!-- Fruit NFTs -->
  <text x="60" y="50" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#A67C52" font-weight="bold">🌰 P-NUTS</text>
  <text x="60" y="70" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#A67C52" font-weight="bold">🌰 ALMD</text>
  <text x="60" y="90" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#A67C52" font-weight="bold">🌰 S-ALMD</text>
  <text x="520" y="50" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#A67C52" font-weight="bold">🌰 PNUTRMY</text>

  <!-- Role labels -->
  <text x="130" y="175" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7D5A50" font-style="italic">branch</text>
  <text x="320" y="40" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7D5A50" font-style="italic">branch</text>
  <text x="510" y="170" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7D5A50" font-style="italic">leaf</text>
  <text x="545" y="265" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7D5A50" font-style="italic">leaf</text>
  <text x="75" y="115" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7D5A50" font-style="italic">fruit</text>
  <text x="320" y="370" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#D1B48C" font-style="italic">trunk</text>
</svg>
